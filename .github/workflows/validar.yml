name: Validar homepage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validar arquivos estáticos
        run: python3 -B -m unittest discover -s tests -v
      - name: Construir a imagem de validação
        run: docker build -t homepage-validacao .
      - name: Conferir Nginx e subir em modo restrito
        run: |
          docker run --rm --entrypoint nginx homepage-validacao -t
          docker run -d --name homepage-validacao --user 101:101 --read-only \
            --tmpfs /var/cache/nginx:uid=101,gid=101 --tmpfs /var/run:uid=101,gid=101 \
            --tmpfs /tmp:uid=101,gid=101 --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:8080:8080 homepage-validacao
          for tentativa in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/saude; then exit 0; fi
            sleep 1
          done
          docker logs homepage-validacao
          exit 1
      - name: Validar página, assets, saúde e isolamento
        env:
          BASE_URL: http://127.0.0.1:8080
        run: python3 -B -m unittest discover -s tests -v
      - name: Encerrar o contêiner de validação
        if: always()
        run: docker rm -f homepage-validacao || true
