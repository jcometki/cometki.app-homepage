map "$status:$recurso_legado:$uri" $politica_cache {
    default "no-store, no-cache, max-age=0, must-revalidate, no-transform";
    ~^200:0:/assets/.+[.]h[0-9a-f]+[.][a-zA-Z0-9]+$ "public, max-age=31536000, immutable, no-transform";
    ~^200:0:/assets/(imagens|fontes)/ "public, max-age=3600, no-transform";
}

map $uri $politica_conteudo {
    default "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
    ~^/experimentar "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; style-src 'self'; font-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
}

map $uri $politica_referencia {
    default strict-origin-when-cross-origin;
    ~^/experimentar no-referrer;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    etag off;
    if_modified_since off;
    set $recurso_legado 0;

    # A API pública usa rotas exatas no Traefik; este serviço serve somente arquivos.
    charset utf-8;
    autoindex off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Um único cabeçalho evita políticas contraditórias e preserva os demais headers.
    add_header Cache-Control $politica_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy $politica_referencia always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $politica_conteudo always;

    location = /saude {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /experimentar {
        try_files /experimentar/index.html =404;
    }

    location = /experimentar/ { return 308 /experimentar; }
    location /experimentar/ { return 404; }

    location /assets/ {
        try_files $uri =404;
    }

    location /api/ {
        # Reservado. Não expõe nem encaminha o painel administrativo do manager.
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # Compatibilidade durante rollouts e para páginas abertas de publicações anteriores.
    location ~ ^/assets/.+[.]h[0-9a-f]+[.][a-zA-Z0-9]+$ {
        try_files $uri @asset_legado;
    }

    location @asset_legado {
        set $recurso_legado 1;
        rewrite ^(/assets/.*/)([^/]+)[.]h[0-9a-f]+([.][a-zA-Z0-9]+)$ $1$2$3 break;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
