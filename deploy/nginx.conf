server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Os arquivos são estáticos. A integração com o manager terá uma rota própria.
    charset utf-8;
    autoindex off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Preservar a página estática: impedir injeção automática de scripts pelo proxy.
    # Os cabeçalhos de cache de cada rota continuam definidos por expires.
    add_header Cache-Control "no-transform" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = /saude {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
    }

    location = /assets/js/configuracao.js {
        expires -1;
    }

    location = /experimentar {
        expires off;
        add_header Cache-Control "no-store, no-transform" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; style-src 'self'; font-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        try_files /experimentar/index.html =404;
    }

    location = /experimentar/ { return 308 /experimentar; }
    location /experimentar/ { return 404; }

    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    location /api/ {
        # Reservado. Não expõe nem encaminha o painel administrativo do manager.
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
